# Redis Configuration file
# Basic Redis config for Docker container with Pub/Sub, user authentication, no persistence
# Configuring logs to be saved in /var/log/redis

# Bind to localhost and specify the port (default is 6379)
bind 0.0.0.0

# Set the port to bind to
port 6379

# Disable persistence (no RDB or AOF files)
save ""
appendonly no

# Limit the number of simultaneous connections (maxconn)
maxclients 1000

# User authentication configuration
# Redis 6.0+ supports ACLs (Access Control Lists) for users
user admin on >password ~* +@all resetchannels &*

# Disable certain command access if needed for security (e.g., disable dangerous commands)
# Note: These can be adjusted depending on security needs.
# For example, we can disable the 'FLUSHDB' and 'FLUSHALL' commands to prevent deletion of data:
rename-command FLUSHDB ""
rename-command FLUSHALL ""

# Log level
loglevel notice

# Set log file location
logfile /var/log/redis/redis-server.log

# Disable the protection mode (if running in a Docker container or trusted environment)
protected-mode no

# configure the maximum number of simultaneous client connections allowed (default is 10,000)
maxclients 1000

# configure the maximum memory Redis can use, if needed. By default, no limit is set.
maxmemory 1gb

# configure eviction policy if using memory limits (you can remove if not applicable)
maxmemory-policy allkeys-lru
